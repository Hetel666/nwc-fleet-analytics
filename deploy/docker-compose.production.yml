services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env.production
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - coolify
    volumes:
      - app-exports:/var/www/html/storage/app/private/dashboard-exports
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.routers.fleet-analytics-http.rule: Host(`${FLEET_DOMAIN}`)
      traefik.http.routers.fleet-analytics-http.entrypoints: http
      traefik.http.routers.fleet-analytics-http.middlewares: fleet-analytics-redirect
      traefik.http.middlewares.fleet-analytics-redirect.redirectscheme.scheme: https
      traefik.http.routers.fleet-analytics.rule: Host(`${FLEET_DOMAIN}`)
      traefik.http.routers.fleet-analytics.entrypoints: https
      traefik.http.routers.fleet-analytics.tls: "true"
      traefik.http.routers.fleet-analytics.tls.certresolver: letsencrypt
      traefik.http.services.fleet-analytics.loadbalancer.server.port: "8080"

  scheduler:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env.production
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true
    user: www-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default
    volumes:
      - app-exports:/var/www/html/storage/app/private/dashboard-exports

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env.production
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["php", "artisan", "queue:work", "--queue=analytics,maintenance,default", "--sleep=3", "--tries=3", "--timeout=900", "--max-time=3600"]
    healthcheck:
      disable: true
    user: www-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default
    volumes:
      - app-exports:/var/www/html/storage/app/private/dashboard-exports

  wialon-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env.production
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["php", "artisan", "queue:work", "--queue=wialon-reports", "--sleep=2", "--tries=6", "--timeout=3600", "--max-time=7200"]
    healthcheck:
      disable: true
    user: www-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default

  live-wialon-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env.production
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["php", "artisan", "queue:work", "--queue=wialon-live", "--sleep=2", "--tries=3", "--timeout=3600", "--max-time=7200"]
    healthcheck:
      disable: true
    user: www-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default

  historical-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env.production
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["php", "artisan", "queue:work", "database", "--queue=historical-recalculations", "--sleep=3", "--tries=6", "--timeout=900", "--max-time=3600"]
    healthcheck:
      disable: true
    user: www-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default
      - coolify

  historical-monthly-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env.production
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["php", "artisan", "queue:work", "database", "--queue=historical-monthly-efficiency", "--sleep=3", "--tries=6", "--timeout=900", "--max-time=3600"]
    healthcheck:
      disable: true
    user: www-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default
      - coolify

  backfill-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env.production
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["php", "artisan", "queue:work", "--queue=wialon-backfill", "--sleep=3", "--tries=6", "--timeout=3600", "--max-time=7200"]
    healthcheck:
      disable: true
    user: www-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      default:
        aliases:
          - fleet-analytics-redis

volumes:
  mysql-data:
  redis-data:
  app-exports:

networks:
  coolify:
    external: true
