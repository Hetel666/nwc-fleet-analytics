<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-label="Automatic synchronization flow">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="980" height="360" fill="#f4f7fb"/>
  <text x="40" y="48" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Автоматическая синхронизация Fleet Analytics</text>
  <text x="40" y="78" font-family="Arial, sans-serif" font-size="15" fill="#475569">Система сама проверяет расписание и обновляет данные Wialon без ручного запуска.</text>

  <g filter="url(#shadow)">
    <rect x="42" y="122" width="190" height="118" rx="10" fill="#ffffff" stroke="#d8e0ec"/>
    <text x="137" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Настройки</text>
    <text x="137" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">интервалы</text>
    <text x="137" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">время запуска</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="294" y="122" width="190" height="118" rx="10" fill="#ffffff" stroke="#d8e0ec"/>
    <text x="389" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Планировщик</text>
    <text x="389" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">проверка каждые</text>
    <text x="389" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">5 минут</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="546" y="122" width="190" height="118" rx="10" fill="#ffffff" stroke="#d8e0ec"/>
    <text x="641" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Wialon</text>
    <text x="641" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">техника</text>
    <text x="641" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">geofence и отчеты</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="798" y="122" width="140" height="118" rx="10" fill="#ffffff" stroke="#d8e0ec"/>
    <text x="868" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Dashboard</text>
    <text x="868" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">обновленные</text>
    <text x="868" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">данные</text>
  </g>

  <line x1="242" y1="181" x2="282" y2="181" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="494" y1="181" x2="534" y2="181" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="746" y1="181" x2="786" y2="181" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="82" y="279" width="816" height="42" rx="21" fill="#e8f0ff" stroke="#bfd3ff"/>
    <text x="490" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1e3a8a">Ручные кнопки остаются доступными: можно запустить синхронизацию техники или geofence в любой момент.</text>
  </g>
</svg>
